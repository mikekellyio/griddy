<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graph paper generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #e9eef2;
    --panel: #ffffff;
    --ink: #1c2731;
    --muted: #5d6b78;
    --line: #cfd9e1;
    --accent: #1f6fb2;
    --accent-ink: #ffffff;
    --field: #f5f8fa;
    --desk: #dfe6ec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141a20; --panel: #1c242c; --ink: #e4ebf1; --muted: #93a2b0;
      --line: #2f3b46; --accent: #5aa6e6; --accent-ink: #0d1620; --field: #232d37; --desk: #10161b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141a20; --panel: #1c242c; --ink: #e4ebf1; --muted: #93a2b0;
    --line: #2f3b46; --accent: #5aa6e6; --accent-ink: #0d1620; --field: #232d37; --desk: #10161b;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.45;
  }
  .wrap {
    display: grid; grid-template-columns: 300px 1fr; gap: 20px;
    max-width: 1400px; margin: 0 auto; padding: 20px;
  }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; padding: 12px; } }
  aside {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px; align-self: start;
  }
  h1 { font-size: 1.35rem; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 0.9rem; }
  fieldset { border: 0; padding: 0; margin: 0 0 18px; }
  legend { font-weight: 600; font-size: 0.95rem; margin-bottom: 8px; padding: 0; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label { display: block; font-size: 0.85rem; color: var(--muted); }
  input[type=number], select {
    width: 100%; margin-top: 4px; padding: 8px 10px; font: inherit; color: var(--ink);
    background: var(--field); border: 1px solid var(--line); border-radius: 6px;
  }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .check { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 0.9rem; margin-top: 8px; }
  .hint { font-size: 0.8rem; color: var(--muted); margin: 8px 0 0; }
  .hint.centered { color: var(--accent); }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 6px; padding: 9px 14px;
    border: 1px solid var(--line); background: var(--field); color: var(--ink);
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .link-btn { margin-top: 8px; padding: 6px 10px; font-size: 0.85rem; }
  main { min-width: 0; }
  .desk {
    background: var(--desk); border: 1px solid var(--line); border-radius: 10px;
    padding: 24px; overflow: auto; max-height: calc(100vh - 140px); min-height: 320px;
    display: flex;
  }
  .desk svg { margin: auto; background: #fff; box-shadow: 0 1px 2px rgba(20,30,40,.18), 0 6px 18px rgba(20,30,40,.10); max-width: none; display: block; }
  .meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 10px; color: var(--muted); font-size: 0.85rem; }
  .status { min-height: 1.2em; font-size: 0.85rem; color: var(--muted); margin-top: 10px; }
  @page { margin: 10mm; }
  @media print {
    :root { padding: 0 !important; }
    html, body { background: #fff !important; margin: 0; }
    aside, .meta { display: none !important; }
    .wrap { display: block; padding: 0; max-width: none; }
    .desk { background: none; border: 0; padding: 0; overflow: visible; max-height: none; min-height: 0; display: block; }
    .desk svg { box-shadow: none; margin: 0 auto; width: 100%; height: auto; max-height: 270mm; page-break-inside: avoid; break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <h1>Graph paper</h1>
    <p class="sub">Set the grid and where the axes cross. The preview is the SVG you'll get.</p>

    <fieldset>
      <legend>Grid size (squares)</legend>
      <div class="row">
        <label>Columns<input id="cols" type="number" min="1" max="200" value="20"></label>
        <label>Rows<input id="rows" type="number" min="1" max="200" value="20"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Origin position</legend>
      <div class="row">
        <label>Y-axis at column line<input id="ox" type="number" min="0" value="10"></label>
        <label>X-axis at row line<input id="oy" type="number" min="0" value="10"></label>
      </div>
      <p class="hint" id="originHint">Counted from the bottom-left corner.</p>
      <button class="link-btn" id="centerBtn" type="button">Center the axes</button>
    </fieldset>

    <fieldset>
      <legend>Appearance</legend>
      <div class="row">
        <label>Square size (px)<input id="cell" type="number" min="4" max="100" value="24"></label>
        <label>Heavy line every<input id="major" type="number" min="0" max="50" value="5"></label>
      </div>
      <label style="margin-top:10px">Numbers on axes
        <select id="labels">
          <option value="1">Every line</option>
          <option value="major">At heavy lines</option>
          <option value="0">None</option>
        </select>
      </label>
      <label class="check"><input id="arrows" type="checkbox" checked> Arrowheads and x / y names</label>
    </fieldset>

    <div class="actions">
      <button class="primary" id="saveBtn" type="button">Download SVG</button>
      <button id="copyBtn" type="button">Copy SVG code</button>
      <button id="printBtn" type="button">Print</button>
    </div>
    <div class="status" id="status" role="status"></div>
  </aside>

  <main>
    <div class="desk" id="desk"></div>
    <div class="meta"><span id="dims"></span><span id="range"></span></div>
  </main>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const els = {
    cols: $('cols'), rows: $('rows'), ox: $('ox'), oy: $('oy'), cell: $('cell'),
    major: $('major'), labels: $('labels'), arrows: $('arrows')
  };
  let centered = true;
  let currentSvg = '';

  const int = (el, def, min, max) => {
    let v = parseInt(el.value, 10);
    if (isNaN(v)) v = def;
    return Math.max(min, Math.min(max, v));
  };

  function settings() {
    const cols = int(els.cols, 20, 1, 200);
    const rows = int(els.rows, 20, 1, 200);
    let ox, oy;
    if (centered) {
      ox = Math.round(cols / 2); oy = Math.round(rows / 2);
      els.ox.value = ox; els.oy.value = oy;
    } else {
      ox = int(els.ox, Math.round(cols / 2), 0, cols);
      oy = int(els.oy, Math.round(rows / 2), 0, rows);
    }
    els.ox.max = cols; els.oy.max = rows;
    return {
      cols, rows, ox, oy,
      cell: int(els.cell, 24, 4, 100),
      major: int(els.major, 5, 0, 50),
      labels: els.labels.value,
      arrows: els.arrows.checked
    };
  }

  function buildSvg(s) {
    const { cols, rows, ox, oy, cell, major, labels, arrows } = s;
    const W = cols * cell, H = rows * cell;
    const fontSize = Math.max(8, Math.min(14, Math.round(cell * 0.5)));
    const over = arrows ? Math.max(14, cell * 0.8) : 0;      // how far axes extend past the grid
    const pad = Math.ceil(over + fontSize * 2.6);            // room for arrows and labels
    const totalW = W + pad * 2, totalH = H + pad * 2;
    const r = n => Math.round(n * 100) / 100;

    // Pixel positions (y flips: row lines counted from bottom)
    const axisX = pad + ox * cell;               // vertical y-axis x-pixel
    const axisY = pad + (rows - oy) * cell;      // horizontal x-axis y-pixel

    const minor = [], heavy = [];
    for (let i = 0; i <= cols; i++) {
      const x = r(pad + i * cell);
      const isMajor = major > 0 && (i - ox) % major === 0;
      (isMajor ? heavy : minor).push(`M${x} ${pad}V${pad + H}`);
    }
    for (let j = 0; j <= rows; j++) {
      const y = r(pad + (rows - j) * cell);
      const isMajor = major > 0 && (j - oy) % major === 0;
      (isMajor ? heavy : minor).push(`M${pad} ${y}H${pad + W}`);
    }

    const parts = [];
    parts.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}">`);
    if (arrows) {
      parts.push(`<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker></defs>`);
    }
    parts.push(`<rect width="100%" height="100%" fill="#ffffff"/>`);
    parts.push(`<path d="${minor.join('')}" stroke="#b9d3ea" stroke-width="1" fill="none"/>`);
    if (heavy.length) parts.push(`<path d="${heavy.join('')}" stroke="#7fa9cf" stroke-width="1.5" fill="none"/>`);

    // Axes
    const mk = arrows ? ` marker-start="url(#arrow)" marker-end="url(#arrow)"` : '';
    parts.push(`<line x1="${r(pad - over)}" y1="${r(axisY)}" x2="${r(pad + W + over)}" y2="${r(axisY)}" stroke="#111" stroke-width="2"${mk}/>`);
    parts.push(`<line x1="${r(axisX)}" y1="${r(pad + H + over)}" x2="${r(axisX)}" y2="${r(pad - over)}" stroke="#111" stroke-width="2"${mk}/>`);

    // Tick numbers
    const font = `font-family="Helvetica, Arial, sans-serif" font-size="${fontSize}" fill="#222"`;
    const step = labels === '1' ? 1 : labels === 'major' ? (major || 0) : 0;
    if (step > 0) {
      const txt = [];
      const tick = Math.max(3, cell * 0.15);
      for (let i = 0; i <= cols; i++) {
        const v = i - ox;
        if (v === 0 || v % step !== 0) continue;
        const x = r(pad + i * cell);
        txt.push(`<line x1="${x}" y1="${r(axisY - tick)}" x2="${x}" y2="${r(axisY + tick)}" stroke="#111" stroke-width="1.5"/>`);
        txt.push(`<text x="${x}" y="${r(axisY + tick + fontSize + 1)}" text-anchor="middle" ${font}>${v < 0 ? '\u2212' + (-v) : v}</text>`);
      }
      for (let j = 0; j <= rows; j++) {
        const v = j - oy;
        if (v === 0 || v % step !== 0) continue;
        const y = r(pad + (rows - j) * cell);
        txt.push(`<line x1="${r(axisX - tick)}" y1="${y}" x2="${r(axisX + tick)}" y2="${y}" stroke="#111" stroke-width="1.5"/>`);
        txt.push(`<text x="${r(axisX - tick - 3)}" y="${r(y + fontSize * 0.35)}" text-anchor="end" ${font}>${v < 0 ? '\u2212' + (-v) : v}</text>`);
      }
      txt.push(`<text x="${r(axisX - 4)}" y="${r(axisY + fontSize + 3)}" text-anchor="end" ${font}>0</text>`);
      parts.push(`<g>${txt.join('')}</g>`);
    }

    if (arrows) {
      const nameFont = `font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="${fontSize + 4}" fill="#111"`;
      parts.push(`<text x="${r(pad + W + over + 6)}" y="${r(axisY + (fontSize + 4) * 0.35)}" ${nameFont}>x</text>`);
      parts.push(`<text x="${r(axisX)}" y="${r(pad - over - 8)}" text-anchor="middle" ${nameFont}>y</text>`);
    }

    parts.push(`</svg>`);
    return { svg: parts.join('\n'), totalW, totalH };
  }

  function render() {
    const s = settings();
    const out = buildSvg(s);
    currentSvg = out.svg;
    $('desk').innerHTML = out.svg;
    $('dims').textContent = `${s.cols} × ${s.rows} squares, ${out.totalW} × ${out.totalH} px`;
    $('range').textContent = `x from ${-s.ox} to ${s.cols - s.ox}, y from ${-s.oy} to ${s.rows - s.oy}`;
    const hint = $('originHint');
    hint.textContent = centered ? 'Centered. Change either number to move the axes.' : 'Counted from the bottom-left corner.';
    hint.classList.toggle('centered', centered);
  }

  ['cols', 'rows', 'cell', 'major', 'labels', 'arrows'].forEach(k => {
    els[k].addEventListener('input', render);
    els[k].addEventListener('change', render);
  });
  ['ox', 'oy'].forEach(k => {
    els[k].addEventListener('input', () => { centered = false; render(); });
  });
  $('centerBtn').addEventListener('click', () => { centered = true; render(); });

  const status = msg => { $('status').textContent = msg; };

  // Download via the platform's downloads capability when published; fall back to a blob link elsewhere.
  let downloads;
  const dlReady = (window.claude && typeof window.claude.use === 'function')
    ? window.claude.use('downloads').then(d => { downloads = d; }).catch(() => { downloads = null; })
    : Promise.resolve();

  $('saveBtn').addEventListener('click', async () => {
    const s = settings();
    const filename = `graph-paper-${s.cols}x${s.rows}.svg`;
    if (window.claude && typeof window.claude.use === 'function') {
      await dlReady;
      if (!downloads) { status('Downloads aren\u2019t available here. Use Copy SVG code instead.'); return; }
      try {
        await downloads.save({ filename, data: currentSvg });
        status(`Downloaded ${filename}.`);
      } catch (e) {
        if (e && e.code === 'declined') status('Download cancelled.');
        else if (e && e.code === 'rate_limited') status('A download prompt is already open.');
        else status('Download isn\u2019t available here. Use Copy SVG code instead.');
      }
      return;
    }
    const url = URL.createObjectURL(new Blob([currentSvg], { type: 'image/svg+xml' }));
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    status(`Downloaded ${filename}.`);
  });

  $('copyBtn').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(currentSvg);
      status('SVG code copied.');
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = currentSvg; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); status('SVG code copied.'); }
      catch (_) { status('Copy failed. Select the preview and save it from your browser.'); }
      ta.remove();
    }
  });

  $('printBtn').addEventListener('click', () => {
    status('Opening the print dialog\u2026');
    try { window.print(); } catch (e) { /* handled below */ }
    setTimeout(() => status(''), 1500);
  });

  render();
})();
</script>
</body>
</html>
